<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Proposal Studio</title>
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --ink: #2b2420; --muted: #8a7f74;
    --accent: #8b5e34; --accent-ink: #fff; --line: #e8e0d5;
    --ok: #2e7d4f; --warn: #b3541e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #171310; --card: #221c17; --ink: #ece5dc; --muted: #a2968a;
      --accent: #c99862; --accent-ink: #171310; --line: #37302a;
      --ok: #6fbf8f; --warn: #e58e55;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.55 "Avenir Next", "Segoe UI", system-ui, sans-serif; }
  header { padding: 20px 24px 8px; }
  header h1 { margin: 0; font-size: 21px; letter-spacing: .3px; }
  header h1 span { color: var(--accent); }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: 380px 1fr; gap: 18px; padding: 18px 24px 40px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 16px; } }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .8px;
          color: var(--muted); margin: 14px 0 5px; }
  input, textarea { width: 100%; background: var(--bg); color: var(--ink);
    border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; font: inherit; }
  textarea { min-height: 130px; resize: vertical; }
  button { font: inherit; border: 0; border-radius: 8px; padding: 10px 18px; cursor: pointer; }
  .primary { background: var(--accent); color: var(--accent-ink); font-weight: 600; margin-top: 16px; width: 100%; }
  .primary:disabled { opacity: .5; cursor: wait; }
  .chip { display: inline-block; font-size: 12px; border: 1px solid var(--line); border-radius: 999px;
          padding: 2px 10px; margin: 2px 4px 2px 0; color: var(--muted); }
  .samples button { display: block; width: 100%; text-align: left; background: transparent;
    border: 1px dashed var(--line); color: var(--muted); margin-top: 8px; font-size: 13px; }
  .samples button:hover { border-color: var(--accent); color: var(--ink); }
  h2 { font-size: 15px; margin: 0 0 6px; color: var(--accent); text-transform: uppercase; letter-spacing: 1px; }
  #result .placeholder { color: var(--muted); text-align: center; padding: 70px 20px; }
  table { width: 100%; border-collapse: collapse; margin: 8px 0 4px; font-size: 14px; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td.num, th.num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
  tr.total td { font-weight: 700; border-top: 2px solid var(--accent); }
  .sectiontext { white-space: pre-wrap; font-size: 14px; }
  .warn { color: var(--warn); font-size: 13px; margin: 4px 0; }
  .src { font-size: 12px; color: var(--muted); border-left: 3px solid var(--line); padding: 4px 10px; margin: 6px 0; }
  .actions { display: flex; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .approve { background: var(--ok); color: #fff; font-weight: 600; }
  .reject { background: transparent; border: 1px solid var(--warn); color: var(--warn); }
  .download { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
  .badge { font-size: 12px; padding: 3px 10px; border-radius: 999px; font-weight: 600; }
  .badge.draft { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); }
  .badge.approved { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
  .badge.rejected { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
  .meta { color: var(--muted); font-size: 13px; margin: 2px 0 14px; }
  details { margin: 10px 0; } summary { cursor: pointer; color: var(--accent); font-weight: 600; font-size: 14px; }
  .error { color: var(--warn); margin-top: 12px; font-size: 14px; }
</style>
</head>
<body>
<header>
  <h1>Proposal <span>Studio</span></h1>
  <p>Describe the event → AI retrieves venue &amp; menu docs, applies pricing rules → you review and approve.</p>
</header>
<main>
  <section class="card">
    <h2>Event Brief</h2>
    <label for="client">Client name</label>
    <input id="client" placeholder="e.g. Rivera Family">
    <label for="brief">Brief</label>
    <textarea id="brief" placeholder="The client is planning a 150-person wedding at the Brazilian Room in September…"></textarea>
    <button class="primary" id="go">Generate Draft Proposal</button>
    <div class="error" id="error"></div>
    <div class="samples">
      <label>Try a sample</label>
      <button data-sample="The client is planning a 150-person wedding at the Brazilian Room in September and would like a cocktail reception followed by a seated dinner. Beer and wine for the bar, plus 6 kids and 4 vendor meals.">150-person September wedding · Brazilian Room</button>
      <button data-sample="Corporate offsite lunch for 80 people at Piedmont Community Hall on 2026-04-16, buffet, no alcohol, several vegetarians on the team.">80-person corporate lunch · Piedmont Hall</button>
      <button data-sample="Client name is Meridian Fund. 180 guest gala at the General's Residence in October, cocktail-style standing reception with full bar.">180-person October gala · General's Residence</button>
    </div>
    <div id="catalog" style="margin-top:18px"></div>
  </section>
  <section class="card" id="result">
    <div class="placeholder">Draft proposals appear here for review.</div>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
const fmt = (n) => '$' + n.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

document.querySelectorAll('.samples button').forEach(b =>
  b.addEventListener('click', () => { $('#brief').value = b.dataset.sample; }));

// ?demo=1 auto-runs the first sample brief — used for screenshots and walkthroughs.
if (new URLSearchParams(location.search).has('demo')) {
  window.addEventListener('load', () => {
    $('#client').value = 'Rivera Family';
    $('#brief').value = document.querySelector('.samples button').dataset.sample;
    $('#go').click();
  });
}

fetch('/api/catalog').then(r => r.json()).then(c => {
  $('#catalog').innerHTML = '<label>Approved sources loaded</label>' +
    c.venues.map(v => `<span class="chip">${v.name}</span>`).join('') +
    c.menus.map(m => `<span class="chip">${m.name} · $${m.price_per_person}/pp</span>`).join('');
});

$('#go').addEventListener('click', async () => {
  const btn = $('#go');
  $('#error').textContent = '';
  btn.disabled = true; btn.textContent = 'Generating…';
  try {
    const res = await fetch('/api/generate', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({brief: $('#brief').value, client_name: $('#client').value || null})
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Generation failed');
    render(data);
  } catch (e) { $('#error').textContent = e.message; }
  btn.disabled = false; btn.textContent = 'Generate Draft Proposal';
});

function render(d) {
  const p = d.pricing;
  const rows = p.line_items.map(i =>
    `<tr><td>${i.description}</td><td class="num">${i.qty}</td><td class="num">${fmt(i.unit_price)}/${i.unit}</td><td class="num">${fmt(i.amount)}</td></tr>`).join('');
  $('#result').innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap">
      <h2 style="margin:0">Draft Proposal · ${d.brief.client_name}</h2>
      <span class="badge ${d.status}" id="status">${d.status}</span>
    </div>
    <p class="meta">${d.venue_name} · ${d.brief.guest_count} guests · ${d.menu_names.join(' + ')}
      · parsed by <strong>${d.generated_by}</strong></p>
    ${p.warnings.map(w => `<p class="warn">⚠ ${w}</p>`).join('')}
    <div class="sectiontext">${esc(d.narrative.overview)}</div>
    <details open><summary>Investment Summary — ${fmt(p.total)} (${fmt(p.per_person)}/guest)</summary>
      <table><thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Unit</th><th class="num">Amount</th></tr></thead>
      <tbody>${rows}
        <tr><td colspan="3">Service charge (22% F&amp;B)</td><td class="num">${fmt(p.service_charge)}</td></tr>
        <tr><td colspan="3">Sales tax (${(p.tax_rate * 100).toFixed(3)}%)</td><td class="num">${fmt(p.sales_tax)}</td></tr>
        <tr class="total"><td colspan="3">Estimated total</td><td class="num">${fmt(p.total)}</td></tr>
        <tr><td colspan="3">Deposit to reserve date</td><td class="num">${fmt(p.deposit_due)}</td></tr>
      </tbody></table></details>
    <details><summary>Venue Notes</summary><div class="sectiontext">${esc(d.narrative.venue)}</div></details>
    <details><summary>Proposed Menu</summary><div class="sectiontext">${esc(d.narrative.menu)}</div></details>
    <details><summary>Sources retrieved (${d.sources.length})</summary>
      ${d.sources.map(s => `<div class="src"><strong>${s.title}</strong> · ${s.doc_id} · score ${s.score}<br>${esc(s.excerpt)}</div>`).join('')}
    </details>
    <div class="actions">
      <button class="approve" onclick="decide('${d.id}','approved')">Approve</button>
      <button class="reject" onclick="decide('${d.id}','rejected')">Send Back</button>
      <a href="/api/proposals/${d.id}/docx"><button class="download">Download .docx</button></a>
    </div>`;
}

async function decide(id, status) {
  const res = await fetch(`/api/proposals/${id}/decision`, {
    method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({status})
  });
  const d = await res.json();
  const el = $('#status'); el.textContent = d.status; el.className = 'badge ' + d.status;
}

function esc(s) { const d = document.createElement('div'); d.textContent = s || ''; return d.innerHTML; }
</script>
</body>
</html>
